[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://www.wordpress-offenbach.de/*"
  to = "https://wordpress-offenbach.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://wordpress-offenbach.netlify.app/*"
  to = "https://wordpress-offenbach.de/:splat"
  status = 301
  force = true
